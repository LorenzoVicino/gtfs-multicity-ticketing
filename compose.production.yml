name: gtfs-hub-production

services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: gtfs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy.env}
      POSTGRES_DB: gtfs_ticketing
    volumes:
      - postgres_production_data:/var/lib/postgresql/data
      - ./data:/work/data:ro
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./data/gtfs/incoming/import_BRI.sql:/docker-entrypoint-initdb.d/02_import_BRI.sql:ro
      - ./data/gtfs/incoming/import_BOL.sql:/docker-entrypoint-initdb.d/03_import_BOL.sql:ro
      - ./db/extend_ticketing.sql:/docker-entrypoint-initdb.d/04_extend_ticketing.sql:ro
      - ./db/agency_ticketing.sql:/docker-entrypoint-initdb.d/05_agency_ticketing.sql:ro
      - ./db/seed_time_ticket_types.sql:/docker-entrypoint-initdb.d/06_seed_time_ticket_types.sql:ro
      - ./db/indexes.sql:/docker-entrypoint-initdb.d/07_indexes.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gtfs -d gtfs_ticketing"]
      interval: 5s
      timeout: 3s
      retries: 12
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: gtfs
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: gtfs_ticketing
      TICKET_QR_SECRET: ${TICKET_QR_SECRET:?Set TICKET_QR_SECRET in deploy.env}
      GTFS_IMPORT_MODE: psql
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - gtfs_uploads:/app/data/gtfs/incoming/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

volumes:
  postgres_production_data:
  gtfs_uploads:

networks:
  backend:
    internal: true
