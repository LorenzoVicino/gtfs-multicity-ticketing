name: gtfs-hub-production

services:
  gtfs-validator:
    image: ghcr.io/mobilitydata/gtfs-validator-api:1.0.0-validator8.0.1@sha256:ca45acfa27a0dbf2388aa5434b5304529d2207fe3d0fde5b31a458e74b2133f7
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: gtfs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy.env}
      POSTGRES_DB: gtfs_ticketing
    volumes:
      - postgres_production_data:/var/lib/postgresql/data
      - ./data:/work/data:ro
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./data/gtfs/incoming/import_BRI.sql:/docker-entrypoint-initdb.d/02_import_BRI.sql:ro
      - ./data/gtfs/incoming/import_BOL.sql:/docker-entrypoint-initdb.d/03_import_BOL.sql:ro
      - ./db/indexes.sql:/docker-entrypoint-initdb.d/04_indexes.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gtfs -d gtfs_ticketing"]
      interval: 5s
      timeout: 3s
      retries: 12
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      gtfs-validator:
        condition: service_started
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: gtfs
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: gtfs_ticketing
      GTFS_IMPORT_MODE: psql
      GTFS_VALIDATOR_URL: http://gtfs-validator:8080/v2
      GTFS_VALIDATOR_COUNTRY_CODE: IT
      GTFS_VALIDATOR_TIMEOUT_MS: 180000
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - gtfs_uploads:/app/data/gtfs/incoming/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

volumes:
  postgres_production_data:
  gtfs_uploads:

networks:
  backend:
    internal: true
