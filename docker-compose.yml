services:
  gtfs-validator:
    image: ghcr.io/mobilitydata/gtfs-validator-api:1.0.0-validator8.0.1@sha256:ca45acfa27a0dbf2388aa5434b5304529d2207fe3d0fde5b31a458e74b2133f7
    container_name: gtfs-validator
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:16
    container_name: gtfs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gtfs_ticketing
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./:/work:ro
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./data/gtfs/incoming/import_BRI.sql:/docker-entrypoint-initdb.d/02_import_BRI.sql:ro
      - ./data/gtfs/incoming/import_BOL.sql:/docker-entrypoint-initdb.d/03_import_BOL.sql:ro
      - ./db/indexes.sql:/docker-entrypoint-initdb.d/04_indexes.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gtfs_ticketing"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
